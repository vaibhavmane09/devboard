# Goal - I've to lint, build, test the code for frontend & backend 
# then push the images to docker hub

name: CI

on:
    push:
        branches: [advanced]

jobs:
    frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Setup-Node Js
              uses: actions/setup-node@v6
              with:
                node-version: '20'
                cache: npm
                cache-dependency-path: frontend/package-lock.json

            - name: Install npm packages
              working-directory: frontend
              run: npm ci

            - name: Run linter
              working-directory: frontend
              run: npm run lint

            - name: Run test
              working-directory: frontend
              run: npm run test  